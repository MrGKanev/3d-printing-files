name = "Tablet wall mount"
summary = "Samsung Galaxy Tab A11 (8.7\"), landscape. Two-part wall mount: plate + press-fit cover (no small screws). The USB-C cable runs through the plate and out a channel on the back. Extra room around the power/volume buttons."
version = "0.6"
status = "draft"            # draft | ready to print | printed | done
printer = "Elegoo Centauri Carbon"
material = "PETG"
layer_height = "0.20 mm"
walls = 4
infill = "15% gyroid"
supports = "none"
orientation = "plate: back side down (cable channel on the bed); cover: outer face down (already flipped in the STL)"
license = "CC BY-NC-SA 4.0"
credit = "Concept after \"Samsung Galaxy Tab A11 Wall Mount / Tablet Holder\" by Maakloods (https://www.printables.com/model/1501242), CC BY-NC-SA 4.0. Geometry is original."
hardware = ["4x countersunk wall screws (~4 mm) + anchors for your wall type"]
notes = [
  "Tablet dimensions 211 x 124.7 x 8 mm (spec sheet). Measure yours (case?) and adjust the parameters in model.py.",
  "ASSUMED, verify: USB-C is at the center of the right edge (port_off) and the buttons sit within 15-65 mm of the top edge's left end (btn_x0/btn_x1). Both are generous cutouts.",
  "The cover is held by 4 split pins pressed into the plate; pry it off at the button cutout. Print a test fit first and tune pin_d (too loose: +0.1, too tight: -0.1). A right-angle USB-C plug is recommended.",
]
changelog = [
  "0.6 - Button cutout in the cover is only 3 mm deep (btn_depth) instead of cutting through the whole border.",
  "0.5 - Narrower button cutout (50 mm instead of 82 mm).",
  "0.4 - Small hex cutouts in the strip right of the tablet (above/below the cable channel).",
  "0.3 - Hex lightening cutouts in the plate (143 g -> 115 g).",
  "0.2 - Two parts (plate + cover) with press-fit pins instead of screws; wider cutout for the power/volume buttons.",
  "0.1 - First draft: one-piece slide-in holder.",
]
